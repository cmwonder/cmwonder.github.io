<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>🐾 名古屋小動物收藏館</title>
<style>
  :root {
    --cream: #fff8ef;
    --pink: #ffb7c5;
    --peach: #ffd9a0;
    --mint: #b8e6d0;
    --brown: #8b5e3c;
    --text: #5c4a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", cursive, sans-serif;
    background: linear-gradient(180deg, #bfe6ff 0%, #dff3ff 45%, var(--cream) 100%);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
  }

  /* ---- floating clouds ---- */
  .cloud {
    position: fixed;
    background: #ffffffcc;
    border-radius: 999px;
    filter: blur(1px);
    animation: drift linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffffcc;
    border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 160%; top: -70%; left: 15%; }
  .cloud::after  { width: 45%; height: 130%; top: -40%; right: 12%; }
  .c1 { width: 120px; height: 38px; top: 8%;  animation-duration: 42s; }
  .c2 { width: 90px;  height: 28px; top: 20%; animation-duration: 55s; animation-delay: -20s; }
  .c3 { width: 150px; height: 45px; top: 40%; animation-duration: 65s; animation-delay: -40s; opacity: .7; }
  @keyframes drift {
    from { transform: translateX(-180px); }
    to   { transform: translateX(calc(100vw + 180px)); }
  }

  /* ---- twinkling stars (pure CSS shapes) ---- */
  .sparkle {
    position: fixed;
    width: 14px; height: 14px;
    background: #ffe98a;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(.7) rotate(0deg); opacity: .45; }
    50%      { transform: scale(1.15) rotate(25deg); opacity: 1; }
  }

  /* ---- ground grass ---- */
  .ground {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 90px;
    background: linear-gradient(180deg, #9be39b, #6ccf6c);
    border-radius: 50% 50% 0 0 / 24px 24px 0 0;
    z-index: 0;
  }
  .ground::after {
    content: "";
    position: absolute;
    top: -14px; left: 0; right: 0;
    height: 28px;
    background: repeating-linear-gradient(90deg,
      transparent 0 24px,
      #8ed98e 24px 30px,
      transparent 30px 70px);
    border-radius: 50%;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 20px 140px;
    text-align: center;
  }

  h1 {
    font-size: 2.5rem;
    color: var(--brown);
    text-shadow: 2px 2px 0 #fff, 0 0 18px #ffffffaa;
    margin-bottom: 8px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  h1 .paw { flex: 0 0 auto; animation: bounce 2.6s ease-in-out infinite; }
  h1 .paw.flip { transform: scaleX(-1); }
  .sub {
    font-size: 1.05rem;
    color: #7a6a55;
    margin-bottom: 44px;
    text-shadow: 0 1px 0 #fff;
  }

  /* ---- card grid ---- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
  }
  .card {
    position: relative;
    background: #fff;
    border-radius: 28px;
    padding: 118px 24px 28px;
    box-shadow: 0 10px 24px #0000001a, 0 2px 0 #0000000d inset;
    border: 4px solid #fff;
    outline: 3px solid transparent;
    transition: transform .25s ease, box-shadow .25s ease, outline-color .25s ease;
    text-decoration: none;
    color: var(--text);
    display: block;
  }
  .card:hover {
    transform: translateY(-8px) rotate(-1deg);
    box-shadow: 0 18px 34px #00000026;
    outline-color: var(--pink);
  }
  .card:active { transform: translateY(-2px) scale(.98); }

  .card .badge {
    position: absolute;
    top: 18px; right: 18px;
    font-size: .78rem;
    background: var(--mint);
    color: #2d6a4f;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: bold;
  }
  .card.plan .badge { background: var(--peach); color: #8a5a1f; }

  .card h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .card p { font-size: .92rem; color: #7a6a55; line-height: 1.6; }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    background: var(--pink);
    color: #7c2d3d;
    font-weight: bold;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: .95rem;
    box-shadow: 0 4px 0 #e08ba0;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .go svg { transition: transform .2s ease; }
  .card.plan .go { background: var(--peach); box-shadow: 0 4px 0 #e0b26b; color: #7c4a12; }
  .card.trip .go { background: var(--mint); box-shadow: 0 4px 0 #7bc9a8; color: #2d6a4f; }
  .card:hover .go { transform: translateY(-2px); box-shadow: 0 6px 0 #e08ba0; }
  .card:hover .go svg { transform: translateX(3px); }
  .card.plan:hover .go { box-shadow: 0 6px 0 #e0b26b; }
  .card.trip:hover .go { box-shadow: 0 6px 0 #7bc9a8; }

  /* ---- animals ---- */
  .animal {
    position: absolute;
    top: -78px;
    left: 50%;
    width: 124px;
    height: 124px;
    filter: drop-shadow(0 8px 8px #00000022);
  }
  .animal svg { width: 100%; height: 100%; display: block; }
  .animal.bear { animation: sway 3.6s ease-in-out infinite; }
  .animal.cat  { animation: bounce 2.4s ease-in-out infinite; }
  .animal.bunny{ animation: hop 2.8s ease-in-out infinite; }

  @keyframes hop {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    25%      { transform: translateX(-50%) translateY(-16px) rotate(-4deg); }
    55%      { transform: translateX(-50%) translateY(0) rotate(2deg); }
    75%      { transform: translateX(-50%) translateY(-7px) rotate(-2deg); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    30%      { transform: translateX(-50%) translateY(-14px) rotate(-3deg); }
    60%      { transform: translateX(-50%) translateY(0) rotate(2deg); }
  }
  @keyframes sway {
    0%, 100% { transform: translateX(-50%) rotate(-5deg); }
    50%      { transform: translateX(-50%) rotate(5deg); }
  }

  /* SVG part animations */
  .ear, .tail, .flower, .pot, .carrot {
    transform-box: fill-box;
  }
  .ear   { animation: earwig 2.8s ease-in-out infinite; transform-origin: bottom center; }
  .cat .ear { animation-delay: .4s; }
  .bunny .ear { animation-delay: .8s; }
  .tail  { animation: tailwag 1.6s ease-in-out infinite; transform-origin: right center; }
  .flower{ animation: earwig 2.2s ease-in-out infinite; transform-origin: bottom center; }
  .pot   { animation: potbob 2.4s ease-in-out infinite; }
  .carrot{ animation: potbob 2s ease-in-out infinite; }
  @keyframes earwig {
    0%, 100% { transform: rotate(0deg); }
    35%      { transform: rotate(-14deg); }
    65%      { transform: rotate(6deg); }
  }
  @keyframes tailwag {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(16deg); }
  }
  @keyframes potbob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  footer {
    margin-top: 46px;
    font-size: .85rem;
    color: #8a7a68;
    text-shadow: 0 1px 0 #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  footer .heart { display: inline-block; animation: bounce 1.4s ease-in-out infinite; }

  @media (max-width: 520px) {
    h1 { font-size: 1.7rem; gap: 8px; }
    h1 .paw { width: 26px; height: 26px; }
    .animal { width: 104px; height: 104px; top: -66px; }
    .card { padding-top: 100px; }
  }
</style>
