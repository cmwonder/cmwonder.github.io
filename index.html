<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐾 收藏館｜財經 × 旅行</title>
<meta name="description" content="兩個分類：🏦 財經儀表板、✈️ 年度旅行檔案。">
<style>
  :root {
    --cream: #fff8ef;
    --pink: #ffb7c5;
    --peach: #ffd9a0;
    --mint: #b8e6d0;
    --sky: #bfe6ff;
    --brown: #8b5e3c;
    --text: #5c4a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", cursive, sans-serif;
    background: linear-gradient(180deg, #bfe6ff 0%, #dff3ff 45%, var(--cream) 100%);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
  }

  /* ---- floating clouds ---- */
  .cloud {
    position: fixed;
    background: #ffffffcc;
    border-radius: 999px;
    filter: blur(1px);
    animation: drift linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffffcc;
    border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 160%; top: -70%; left: 15%; }
  .cloud::after  { width: 45%; height: 130%; top: -40%; right: 12%; }
  .c1 { width: 120px; height: 38px; top: 8%;  animation-duration: 42s; }
  .c2 { width: 90px;  height: 28px; top: 20%; animation-duration: 55s; animation-delay: -20s; }
  .c3 { width: 150px; height: 45px; top: 40%; animation-duration: 65s; animation-delay: -40s; opacity: .7; }
  @keyframes drift {
    from { transform: translateX(-180px); }
    to   { transform: translateX(calc(100vw + 180px)); }
  }

  /* ---- twinkling stars ---- */
  .sparkle {
    position: fixed;
    width: 14px; height: 14px;
    background: #ffe98a;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(.7) rotate(0deg); opacity: .45; }
    50%      { transform: scale(1.15) rotate(25deg); opacity: 1; }
  }

  /* ---- ground grass ---- */
  .ground {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 90px;
    background: linear-gradient(180deg, #9be39b, #6ccf6c);
    border-radius: 50% 50% 0 0 / 24px 24px 0 0;
    z-index: 0;
  }
  .ground::after {
    content: "";
    position: absolute;
    top: -14px; left: 0; right: 0;
    height: 28px;
    background: repeating-linear-gradient(90deg,
      transparent 0 24px,
      #8ed98e 24px 30px,
      transparent 30px 70px);
    border-radius: 50%;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 20px 150px;
    text-align: center;
  }

  h1 {
    font-size: 2.5rem;
    color: var(--brown);
    text-shadow: 2px 2px 0 #fff, 0 0 18px #ffffffaa;
    margin-bottom: 8px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  h1 .paw { flex: 0 0 auto; animation: bounce 2.6s ease-in-out infinite; }
  h1 .paw.flip { transform: scaleX(-1); }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-10px) rotate(-4deg); }
    60%      { transform: translateY(0) rotate(3deg); }
  }
  .sub {
    font-size: 1.05rem;
    color: #7a6a55;
    margin-bottom: 44px;
    text-shadow: 0 1px 0 #fff;
  }

  /* ---- category cards ---- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
  }
  .cat {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    border-radius: 28px;
    padding: 34px 26px 30px;
    text-decoration: none;
    color: var(--text);
    border: 4px solid #fff;
    outline: 3px solid transparent;
    box-shadow: 0 10px 24px #0000001a, 0 2px 0 #0000000d inset;
    transition: transform .25s ease, box-shadow .25s ease, outline-color .25s ease;
  }
  .cat:hover {
    transform: translateY(-8px) rotate(-1deg);
    box-shadow: 0 18px 34px #00000026;
    outline-color: var(--pink);
  }
  .cat:active { transform: translateY(-2px) scale(.98); }
  .cat.finance:hover { outline-color: var(--mint); }

  .cat .badge {
    font-size: 3.1rem;
    line-height: 1;
    margin-bottom: 16px;
    filter: drop-shadow(0 6px 6px #00000022);
  }
  .cat.travel .badge { animation: bounce 3.2s ease-in-out infinite; }
  .cat.finance .badge { animation: sway 3.6s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }

  .cat h2 { font-size: 1.32rem; margin-bottom: 10px; line-height: 1.4; }
  .cat .tag {
    display: inline-block;
    font-size: .8rem;
    font-weight: bold;
    letter-spacing: .6px;
    border-radius: 999px;
    padding: 3px 13px;
    margin-bottom: 12px;
  }
  .cat.travel .tag { background: #fdf1de; color: #8a5a1f; }
  .cat.finance .tag { background: #e7f3fb; color: #1d5b82; }
  .cat p { font-size: .92rem; color: #7a6a55; line-height: 1.7; }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    background: var(--peach);
    color: #7c4a12;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: .95rem;
    box-shadow: 0 4px 0 #e0b26b;
    transition: transform .15s ease;
  }
  .cat.finance .go { background: var(--mint); color: #2d6a4f; box-shadow: 0 4px 0 #8fcdb2; }
  .cat:hover .go { transform: translateY(-2px); }
  .cat:hover .go svg { transform: translateX(3px); }
  .go svg { transition: transform .2s ease; }

  footer {
    margin-top: 50px;
    font-size: .85rem;
    color: #8a7a68;
    text-shadow: 0 1px 0 #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  footer .heart { display: inline-block; animation: bounce 1.4s ease-in-out infinite; }

  @media (max-width: 520px) {
    h1 { font-size: 1.7rem; gap: 8px; }
    h1 .paw { width: 26px; height: 26px; }
    .wrap { padding-top: 44px; }
    .cat .badge { font-size: 2.6rem; }
  }
</style>
</head>
<body>

  <!-- sky decorations -->
  <div class="cloud c1" style="left:-120px"></div>
  <div class="cloud c2" style="left:-90px"></div>
  <div class="cloud c3" style="left:-150px"></div>
  <span class="sparkle" style="top:14%; left:8%;  animation-delay:0s;   background:#ffe98a"></span>
  <span class="sparkle" style="top:24%; right:10%; animation-delay:.8s; width:11px; height:11px; background:#ffd0e3"></span>
  <span class="sparkle" style="top:56%; left:5%;  animation-delay:1.6s; background:#ffb7c5"></span>
  <span class="sparkle" style="top:48%; right:6%;  animation-delay:2.2s; width:9px; height:9px; background:#c9f2d8"></span>
  <div class="ground"></div>

  <div class="wrap">
    <h1>
      <svg class="paw" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
        <ellipse cx="20" cy="27" rx="10.5" ry="8.5" fill="#c98f62"/>
        <circle cx="9.5" cy="14" r="4.6" fill="#c98f62"/>
        <circle cx="20" cy="10" r="4.6" fill="#c98f62"/>
        <circle cx="30.5" cy="14" r="4.6" fill="#c98f62"/>
        <circle cx="20" cy="21" r="3" fill="#e8b48c" opacity=".6"/>
      </svg>
      收藏館
      <svg class="paw flip" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
        <ellipse cx="20" cy="27" rx="10.5" ry="8.5" fill="#c98f62"/>
        <circle cx="9.5" cy="14" r="4.6" fill="#c98f62"/>
        <circle cx="20" cy="10" r="4.6" fill="#c98f62"/>
        <circle cx="30.5" cy="14" r="4.6" fill="#c98f62"/>
        <circle cx="20" cy="21" r="3" fill="#e8b48c" opacity=".6"/>
      </svg>
    </h1>
    <p class="sub">兩個分類，選一個開始逛 ✨</p>

    <div class="cards">

      <!-- ===== 旅行 ===== -->
      <a class="cat travel" href="travel/">
        <div class="badge" aria-hidden="true">✈️</div>
        <h2>旅行收藏館</h2>
        <span class="tag">2026 · 2027</span>
        <p>一年一頁的旅行檔案：2026 名古屋 9 日遊、2027 九州 10 天 9 夜的行程、交通與美食地圖。</p>
        <span class="go">打開旅行收藏館
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path d="M3 10 h12 m-5 -5 l5 5 l-5 5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <!-- ===== 財經 ===== -->
      <a class="cat finance" href="finance/">
        <div class="badge" aria-hidden="true">🏦</div>
        <h2>財經儀表板</h2>
        <span class="tag">老錢撤美債</span>
        <p>老錢撤美債預警儀表板：用 Fed custody、TIC、拍債需求、美元與黃金，追蹤外國官方是否系統性降低美債曝險。</p>
        <span class="go">打開財經儀表板
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path d="M3 10 h12 m-5 -5 l5 5 l-5 5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

    </div>

    <footer>
      made with
      <svg class="heart" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
        <path d="M10 18 C4 13 1 9.5 1 6.5 C1 3.5 3.5 1.5 6 1.5 C7.8 1.5 9.3 2.5 10 4 C10.7 2.5 12.2 1.5 14 1.5 C16.5 1.5 19 3.5 19 6.5 C19 9.5 16 13 10 18 Z" fill="#ff7b9c"/>
      </svg>
      by 牛奶糖 &amp; friends
    </footer>
  </div>

</body>
</html>
