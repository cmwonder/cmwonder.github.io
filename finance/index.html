<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🏦 財經收藏｜儀表板清單</title>
<meta name="description" content="財經儀表板清單：老錢撤美債預警儀表板。">
<style>
  :root {
    --cream: #fff8ef;
    --pink: #ffb7c5;
    --peach: #ffd9a0;
    --mint: #b8e6d0;
    --sky: #bfe6ff;
    --brown: #8b5e3c;
    --text: #5c4a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", cursive, sans-serif;
    background: linear-gradient(180deg, #bfe6ff 0%, #dff3ff 45%, var(--cream) 100%);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
  }

  /* ---- floating clouds ---- */
  .cloud {
    position: fixed;
    background: #ffffffcc;
    border-radius: 999px;
    filter: blur(1px);
    animation: drift linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffffcc;
    border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 160%; top: -70%; left: 15%; }
  .cloud::after  { width: 45%; height: 130%; top: -40%; right: 12%; }
  .c1 { width: 120px; height: 38px; top: 8%;  animation-duration: 42s; }
  .c2 { width: 90px;  height: 28px; top: 20%; animation-duration: 55s; animation-delay: -20s; }
  .c3 { width: 150px; height: 45px; top: 40%; animation-duration: 65s; animation-delay: -40s; opacity: .7; }
  @keyframes drift {
    from { transform: translateX(-180px); }
    to   { transform: translateX(calc(100vw + 180px)); }
  }

  /* ---- twinkling stars ---- */
  .sparkle {
    position: fixed;
    width: 14px; height: 14px;
    background: #ffe98a;
    clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(.7) rotate(0deg); opacity: .45; }
    50%      { transform: scale(1.15) rotate(25deg); opacity: 1; }
  }

  /* ---- ground grass ---- */
  .ground {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 90px;
    background: linear-gradient(180deg, #9be39b, #6ccf6c);
    border-radius: 50% 50% 0 0 / 24px 24px 0 0;
    z-index: 0;
  }
  .ground::after {
    content: "";
    position: absolute;
    top: -14px; left: 0; right: 0;
    height: 28px;
    background: repeating-linear-gradient(90deg,
      transparent 0 24px,
      #8ed98e 24px 30px,
      transparent 30px 70px);
    border-radius: 50%;
  }

  .back {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 5;
    background: #fffc;
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 6px 14px;
    text-decoration: none;
    color: var(--brown);
    font-weight: bold;
    font-size: .9rem;
    box-shadow: 0 3px 10px #0000001a;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 20px 150px;
    text-align: center;
  }

  h1 {
    font-size: 2.4rem;
    color: var(--brown);
    text-shadow: 2px 2px 0 #fff, 0 0 18px #ffffffaa;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .sub {
    font-size: 1.05rem;
    color: #7a6a55;
    margin-bottom: 44px;
    text-shadow: 0 1px 0 #fff;
  }

  /* ---- item list ---- */
  .list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    text-align: left;
  }
  .item {
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 28px;
    padding: 30px 26px 28px;
    text-decoration: none;
    color: var(--text);
    border: 4px solid #fff;
    outline: 3px solid transparent;
    box-shadow: 0 10px 24px #0000001a, 0 2px 0 #0000000d inset;
    transition: transform .25s ease, box-shadow .25s ease, outline-color .25s ease;
  }
  .item:hover {
    transform: translateY(-8px) rotate(-1deg);
    box-shadow: 0 18px 34px #00000026;
    outline-color: var(--mint);
  }
  .item:active { transform: translateY(-2px) scale(.98); }

  .item .badge {
    font-size: 3rem;
    line-height: 1;
    margin-bottom: 14px;
    animation: sway 3.6s ease-in-out infinite;
    filter: drop-shadow(0 6px 6px #00000022);
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }
  .item h2 { font-size: 1.28rem; margin-bottom: 10px; line-height: 1.4; }
  .item .tag {
    display: inline-block;
    align-self: flex-start;
    font-size: .8rem;
    font-weight: bold;
    letter-spacing: .6px;
    background: #e7f3fb;
    color: #1d5b82;
    border-radius: 999px;
    padding: 3px 13px;
    margin-bottom: 12px;
  }
  .item p { font-size: .92rem; color: #7a6a55; line-height: 1.7; }

  .go {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    gap: 6px;
    margin-top: 20px;
    background: var(--mint);
    color: #2d6a4f;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: .95rem;
    box-shadow: 0 4px 0 #8fcdb2;
    transition: transform .15s ease;
  }
  .item:hover .go { transform: translateY(-2px); }
  .item:hover .go svg { transform: translateX(3px); }
  .go svg { transition: transform .2s ease; }

  footer {
    margin-top: 50px;
    font-size: .85rem;
    color: #8a7a68;
    text-shadow: 0 1px 0 #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  footer .heart { display: inline-block; animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-10px) rotate(-4deg); }
    60%      { transform: translateY(0) rotate(3deg); }
  }

  @media (max-width: 520px) {
    h1 { font-size: 1.7rem; }
    .wrap { padding-top: 56px; }
    .item .badge { font-size: 2.6rem; }
  }
</style>
</head>

  <span class="sparkle" style="top:56%; left:5%;  animation-delay:1.6s; background:#ffb7c5"></span>

  </div>

</body>
</html>
